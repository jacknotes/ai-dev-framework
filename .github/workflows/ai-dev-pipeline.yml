# ============================================================================
# CI/CD 流水线：多智能体协同开发的自动门禁
# （本文件是 tools/new-project.ps1 注入所有新项目的 CI 源，改动影响全部模板）
#
# 为什么门禁1-3绝不允许按前端/后端拆成多个 job（ticket-system 实证）：
#   五个门禁脚本 scripts/*.sh 是「前后端合一」的：lint.sh 同时要求前端
#   node_modules 和后端工具链（ruff / go vet / mvn / dotnet format / mvn），
#   test.sh 同时要求后端测试器（pytest / go test / mvn test / dotnet test）
#   和前端 Vitest。首版把它们拆进只装单侧工具链的 frontend-check 与
#   backend-check-* 多个 job——每个 job 都因缺另一侧工具链而假失败
#   （ticket-system 首跑 27 秒全红实证）。
#   正确做法：单个 job 按 detect-stack 的结果条件装齐对应工具链组合，
#   在同一 job 里跑完 lint/build/test 三道门禁，退出码真实可判。
#
# 探活与执行位置（ticket-system 实证）：
#   e2e / health / k6 / ZAP 一律优先在 compose 网络容器内执行，打点服务名
#   （http://backend:8000，jsp-servlet 为 8080），不依赖宿主机 localhost：
#     - 模板 compose 默认不发布端口（4 套老模板仅发布 127.0.0.1:18080 供本机
#       调试），宿主机 curl http://localhost:8000/health 必败（宿主机探活缺陷）；
#     - grafana/k6-action 的容器连不上 runner 宿主机 localhost（ticket-system
#       实测 78447 个请求全部秒失败、data_received=0B），因此 k6 必须作为
#       compose 服务入网。grafana/k6 镜像的 entrypoint 就是 /k6 可执行文件
#       本身，不可清空——用 `docker compose run --rm k6 run /scripts/xxx.js`
#       传子命令（清空 entrypoint 实测 exit 1）；
#     - ZAP 必须用完整路径 /zap/zap-baseline.py 调用，不能经 bash -lc
#       （login shell 的 /etc/profile 会重置 PATH，丢掉镜像 ENV 的 /zap）；
#       zap 服务 entrypoint: [] + command: [sleep, infinity] 常驻供 exec。
#       5 套模板的 compose 都没有 zap 服务定义（同源缺陷），由各自的
#       deploy/docker-compose.ci.yml CI 覆盖文件按模板配套提供，主 compose
#       保持零端口/原样不改。
#
# 对 4 套老模板（compose 只有 backend+frontend，无 gates/test-runner 服务）
# 的诚实降级策略——每一档都有真实依据，禁止假通过：
#   e2e：先按用例文件分支（与 react-python e2e.sh 的判定口径一致）——
#        tests/e2e/ 下无 *.spec.* / *.test.* 时明确打印"跳过不等于通过"并
#        exit 0；有用例时宿主机跑契约入口 bash scripts/e2e.sh。
#        react-python 例外：检测到 test-runner 服务后在容器内直调 Playwright
#        （e2e.sh 按"scripts 父目录"找用例，与 test-runner 的 /tests 挂载布局
#        不兼容，ticket-system 实测会误判无用例而假跳过）。
#   health：docker compose up -d --wait 依赖各模板 backend 自带的 healthcheck
#        （5 套模板全部定义），--wait 成功即证明健康check 通过；随后
#        scripts/health.sh 收集契约退出码——有 gates 服务的栈在容器内打点
#        http://backend:8000；无 gates 的栈在宿主机打点 compose 已发布的
#        127.0.0.1:18080（端口发布是主 compose 的既定语义，不算破坏隔离）。
#
# 其余：门禁合并后 detect-stack 只负责识别栈并输出；deploy-prod 语义不变
#   （仅 main 分支 + GitHub Environment 人工审批，绝不自动上线）。
# ============================================================================

name: AI Dev Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# 权限最小化
permissions:
  contents: read
  security-events: write

env:
  # 仅测试环境变量，无任何生产凭证
  TEST_DB_PASSWORD: test_only_password
  # CI 专用 compose 组合：主文件（保持原样）+ ci 覆盖文件（按模板补 zap/k6
  # 服务，全部容器网络内执行，零新增端口发布）
  COMPOSE_ARGS: -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml

jobs:
  # ---------- 前置：识别技术栈 ----------
  detect-stack:
    name: 识别技术栈
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      node-cache: ${{ steps.detect.outputs.node-cache }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          # 后端：看哪个标志文件存在。
          # jsp-servlet 与 java-spring 同为 pom.xml，以 <packaging>war</packaging>
          # 区分：JSP 遗留栈打 war 部署进 Tomcat，Spring Boot 打可执行 jar。
          if [ -f backend/go.mod ]; then
            echo "backend=go" >> "$GITHUB_OUTPUT"
          elif [ -f backend/requirements.txt ]; then
            echo "backend=python" >> "$GITHUB_OUTPUT"
          elif [ -f backend/pom.xml ] && grep -q '<packaging>war</packaging>' backend/pom.xml; then
            echo "backend=jsp" >> "$GITHUB_OUTPUT"
          elif [ -f backend/pom.xml ]; then
            echo "backend=java" >> "$GITHUB_OUTPUT"
          elif ls backend/*.csproj >/dev/null 2>&1; then
            echo "backend=dotnet" >> "$GITHUB_OUTPUT"
          else
            echo "backend=none" >> "$GITHUB_OUTPUT"
          fi

          # 前端：看 package.json
          if [ -f frontend/package.json ]; then
            echo "frontend=node" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=none" >> "$GITHUB_OUTPUT"
          fi

          # 模板默认不带 package-lock.json：只有锁文件存在才启用 setup-node 的
          # npm 缓存，否则 setup-node 因找不到 cache-dependency-path 而硬失败
          if [ -f frontend/package-lock.json ]; then
            echo "node-cache=npm" >> "$GITHUB_OUTPUT"
          else
            echo "node-cache=" >> "$GITHUB_OUTPUT"
          fi

  # ---------- 门禁1-3：lint + build + test（单 job 装齐全套工具链）----------
  gates:
    name: 门禁 lint+build+test（单 job，双工具链）
    runs-on: ubuntu-latest
    needs: [detect-stack]
    steps:
      - uses: actions/checkout@v4

      # ---- 按 detect-stack 结果在同一 job 内条件组合安装 ----
      # 各栈组合（由五入口脚本的实际工具链需求勘察得出）：
      #   react-python：Node 20 + Python 3.12（lint.sh 同时要 ESLint 与 ruff）
      #   vue-go：      Node 20 + Go 1.22（lint.sh 同时要 ESLint 与 go vet）
      #   java-spring： Node 20 + JDK 21 + Maven（Runner 自带 mvn）
      #   dotnet：      Node 20 + .NET SDK 8
      #   jsp-servlet： 仅 JDK 17 + Maven（无 frontend/，pom 声明 release 17）
      - name: 安装 Node 20（存在 frontend/package.json 时）
        if: needs.detect-stack.outputs.frontend == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ needs.detect-stack.outputs.node-cache }}
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        if: needs.detect-stack.outputs.frontend == 'node'
        working-directory: frontend
        run: |
          # 有锁文件 → npm ci（可复现，快）；无锁文件 → npm install
          # （模板默认不带锁文件，生成后建议提交回仓库）
          if [ -f package-lock.json ]; then
            echo "使用 npm ci（检测到 package-lock.json）"
            npm ci --no-audit --no-fund
          else
            echo "::warning::未找到 frontend/package-lock.json，降级为 npm install。建议把生成的锁文件提交回仓库以获得可复现构建。"
            npm install --no-audit --no-fund
          fi

      - name: 安装 Python 3.12（存在 backend/requirements.txt 时）
        if: needs.detect-stack.outputs.backend == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装后端 Python 依赖（含 ruff / pytest）
        if: needs.detect-stack.outputs.backend == 'python'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # lint.sh 会显式检查 ruff、test.sh 会显式检查 pytest——
          # 即使 requirements-dev.txt 已含，也显式装一遍，门禁检查必过
          pip install ruff pytest

      - name: 安装 Go 1.22（存在 backend/go.mod 时）
        if: needs.detect-stack.outputs.backend == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装 JDK 21 + Maven（Spring Boot 后端）
        if: needs.detect-stack.outputs.backend == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 JDK 17 + Maven（jsp-servlet 后端，pom 声明 release 17）
        if: needs.detect-stack.outputs.backend == 'jsp'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 .NET SDK 8（存在 backend/*.csproj 时）
        if: needs.detect-stack.outputs.backend == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---- 三道门禁：与本地、容器内完全相同的命令，只认真实退出码 ----
      # 不假设脚本内部行为（各栈脚本内容有差异），只调用五入口契约。
      - name: 门禁 lint
        run: bash scripts/lint.sh
      - name: 门禁 build
        run: bash scripts/build.sh
      - name: 门禁 test（覆盖率阈值由各栈脚本自行判定）
        run: bash scripts/test.sh

  # ---------- 门禁4：e2e + 健康检查（隔离容器内执行 / 诚实降级）----------
  integration-e2e:
    name: e2e + 健康检查（隔离容器）
    runs-on: ubuntu-latest
    needs: [detect-stack, gates]
    steps:
      - uses: actions/checkout@v4

      - name: 检测执行器（test-runner / gates 服务是否存在）
        id: services
        run: |
          # 用 compose 自身配置判断服务是否存在（profile 服务要带 --profile 才会
          # 列出）。运行时探测而非编译期假设：项目后续增删服务时 workflow 零改动。
          if docker compose $COMPOSE_ARGS --profile e2e config --services | grep -qx 'test-runner'; then
            echo "has-test-runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-test-runner=false" >> "$GITHUB_OUTPUT"
          fi
          if docker compose $COMPOSE_ARGS --profile gates config --services | grep -qx 'gates'; then
            echo "has-gates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-gates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并启动隔离环境（--wait 依赖各模板 backend/frontend 自带 healthcheck）
        run: |
          if [ "${{ steps.services.outputs.has-test-runner }}" = "true" ]; then
            docker compose $COMPOSE_ARGS --profile gates --profile e2e up -d --build --wait
          elif [ "${{ steps.services.outputs.has-gates }}" = "true" ]; then
            docker compose $COMPOSE_ARGS --profile gates up -d --build --wait
          else
            docker compose $COMPOSE_ARGS up -d --build --wait
          fi

      # ---- e2e：两条真实路径，绝不假通过 ----
      # react-python：test-runner 容器内有浏览器 + 预装 Playwright。直调
      #   playwright 而不是 bash scripts/e2e.sh：e2e.sh 按"scripts 的父目录"
      #   定位用例（ROOT/tests/e2e），而 test-runner 的挂载是 tests/e2e → /tests
      #   （直接对应用例目录），两种布局不兼容，脚本会误判"无用例"而假跳过
      #   （ticket-system 实证）。退出码真实可判。
      - name: 门禁 e2e（test-runner 容器内，Playwright）
        if: steps.services.outputs.has-test-runner == 'true'
        run: |
          docker compose $COMPOSE_ARGS exec -T test-runner bash -lc \
            'cd /tests && npx --no-install playwright test > /tmp/e2e.log 2>&1; code=$?; tail -40 /tmp/e2e.log; exit $code'
          echo "[e2e] 通过"

      # 4 套老模板：宿主机跑契约入口。先按用例文件分支（口径与 react-python
      #   的 e2e.sh 一致）：vue-go/java-spring 的 tests/e2e/ 只有 README/.gitkeep
      #   而目录存在，其 e2e.sh 的占位判定只看目录存在性，会去调 npx playwright
      #   （runner 上联网拉包且无浏览器，既非真实验证也易假失败），所以由
      #   workflow 先判定"确实有用例文件"才执行；无用例时明确打印
      #   "跳过不等于通过"——这是诚实跳过，不是假通过。
      - name: 门禁 e2e（宿主机契约入口，无用例时诚实跳过）
        if: steps.services.outputs.has-test-runner != 'true'
        run: |
          if find tests/e2e -type f \( -name '*.spec.ts' -o -name '*.spec.js' -o -name '*.test.ts' -o -name '*.test.js' \) 2>/dev/null | grep -q .; then
            bash scripts/e2e.sh
          else
            echo "[e2e] 未发现 e2e 用例（tests/e2e/ 下无 *.spec.* / *.test.*），跳过"
            echo "[e2e] 注意：跳过不等于通过，不代表功能已验证，交付前必须补齐真实用例"
            exit 0
          fi

      # ---- health：docker compose up --wait 成功 = healthcheck 已通过 ----
      #（5 套模板 backend 均定义 healthcheck）。再跑 scripts/health.sh 收集契约
      # 退出码，探活位置按栈能力选择，两个分支都是真实探测：
      #   有 gates 服务：容器内打点 http://backend:8000（零端口，服务名直连，
      #     gates 容器内自带 curl）；
      #   无 gates：宿主机打点 compose 已发布的 127.0.0.1:18080（4 套老模板
      #     的既定端口发布语义；jsp-servlet 的 health.sh 同样接受 PORT）。
      - name: 门禁 health（gates 容器内，探 backend 服务名）
        if: steps.services.outputs.has-gates == 'true'
        run: docker compose $COMPOSE_ARGS exec -T gates bash -lc \
          'HEALTH_HOST=backend PORT=8000 bash scripts/health.sh'

      - name: 门禁 health（宿主机，探 compose 已发布的 127.0.0.1:18080）
        if: steps.services.outputs.has-gates != 'true'
        run: PORT=18080 bash scripts/health.sh

      - name: 销毁隔离环境（用完即弃）
        if: always()
        run: docker compose $COMPOSE_ARGS --profile gates --profile e2e down -v --remove-orphans

  # ---------- 门禁5：安全扫描（依赖审计 + ZAP 基线，隔离环境）----------
  security-scan:
    name: 安全扫描（依赖+Web）
    runs-on: ubuntu-latest
    needs: [detect-stack, gates]
    steps:
      - uses: actions/checkout@v4

      - name: 依赖漏洞审计（trivy）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH        # 门禁：无 Critical/High
          exit-code: 1

      - name: 检测 CI 覆盖文件是否定义 zap 服务
        id: services
        run: |
          if docker compose $COMPOSE_ARGS --profile zap config --services | grep -qx 'zap'; then
            echo "has-zap=true" >> "$GITHUB_OUTPUT"
            echo "[zap] 检测到 zap 服务（deploy/docker-compose.ci.yml），将执行 Web 基线扫描"
          else
            echo "has-zap=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CI 覆盖文件未定义 zap 服务，跳过 Web 扫描（诚实跳过，非通过判定）"
          fi

      - name: 启动环境（--wait 证明 healthcheck 通过）与 ZAP
        if: steps.services.outputs.has-zap == 'true'
        run: |
          docker compose $COMPOSE_ARGS up -d --build --wait
          docker compose $COMPOSE_ARGS --profile zap up -d zap

      - name: OWASP ZAP 基线扫描（backend 服务名，容器网络内）
        if: steps.services.outputs.has-zap == 'true'
        run: |
          # 目标端口按栈选择：5 套模板 backend 内部端口都是 8000，仅 jsp-servlet 是 8080
          case "${{ needs.detect-stack.outputs.backend }}" in
            jsp) TARGET=http://backend:8080 ;;
            *)   TARGET=http://backend:8000 ;;
          esac
          echo "[zap] 目标：$TARGET"
          # 完整路径调用，不经 bash -lc：login shell 的 /etc/profile 会重置 PATH，
          # 把 ZAP 镜像 ENV 里的 /zap 丢掉（ticket-system 实测
          # zap-baseline.py: command not found）。
          # -I：WARN 不判定失败，FAIL 才算（基线扫描对示例前端会产生大量
          # 缺 CSP 头之类的 WARN）。退出码真实可判。
          docker compose $COMPOSE_ARGS exec -T zap /zap/zap-baseline.py \
            -t "$TARGET" -r zap-report.html -I
          echo "[zap] 基线扫描通过（无 FAIL）"

      - name: 取回扫描报告并归档
        if: always() && steps.services.outputs.has-zap == 'true'
        run: docker compose $COMPOSE_ARGS cp zap:/zap/wrk/zap-report.html ./zap-report.html || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.services.outputs.has-zap == 'true'
        with:
          name: security-report
          path: zap-report.html
          if-no-files-found: ignore

      - name: 销毁隔离环境
        if: always()
        run: docker compose $COMPOSE_ARGS --profile zap down -v --remove-orphans

  # ---------- 门禁6：性能测试（k6 服务入 compose 网络，打点 backend 服务名）----------
  # 首版用 grafana/k6-action 从 runner 打宿主机 localhost:8000，实测 k6-action
  # 的容器连不上 runner 宿主机（ticket-system：78447 个请求全部秒失败、
  # data_received=0B）。改为 k6 作为 compose 服务入网，API_BASE_URL=
  # http://backend:8000（由各栈 deploy/docker-compose.ci.yml 提供 k6 服务）。
  performance-test:
    name: 性能测试（k6）
    runs-on: ubuntu-latest
    needs: [detect-stack, gates]
    steps:
      - uses: actions/checkout@v4

      - name: 检测 k6 用例与 k6 服务
        id: perf
        run: |
          # 有脚本才需要跑性能门禁；没脚本的栈诚实跳过（java-spring / dotnet /
          # jsp-servlet 的 tests/performance 只有 .gitkeep）
          if ls tests/performance/*.js >/dev/null 2>&1; then
            echo "has-k6=true" >> "$GITHUB_OUTPUT"
            echo "[k6] 检测到性能用例，将执行 k6 压测"
          else
            echo "has-k6=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/performance/ 下无 k6 脚本，跳过性能门禁（诚实跳过，非通过判定）"
          fi
          if docker compose $COMPOSE_ARGS --profile perf config --services | grep -qx 'k6'; then
            echo "has-k6-service=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-k6-service=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 启动环境（含 k6 服务，零端口发布）
        if: steps.perf.outputs.has-k6 == 'true'
        run: docker compose $COMPOSE_ARGS --profile perf up -d --build

      # 不用宿主机 curl 探活（模板默认不发布 8000；react-python 零端口）：
      # 直接读 backend 容器的 healthcheck 状态——它就是 --wait 的判定依据，
      # 不依赖任何宿主机探活能力。（不用 up --wait 是因为 profile 里的一脚
      # k6 容器无常驻命令，会干扰 --wait 的判定。）
      - name: 等待后端健康（读 compose healthcheck 状态）
        if: steps.perf.outputs.has-k6 == 'true'
        run: |
          cid="$(docker compose $COMPOSE_ARGS ps -q backend)"
          for i in $(seq 1 60); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              echo "后端就绪（第 $i 次探测，healthcheck=healthy）"; exit 0
            fi
            sleep 2
          done
          echo "!! 后端 120 秒内未健康"
          docker compose $COMPOSE_ARGS logs backend
          exit 1

      - name: 运行 k6 压测（阈值即门禁，不达标 k6 非 0 退出）
        if: steps.perf.outputs.has-k6 == 'true' && steps.perf.outputs.has-k6-service == 'true'
        run: |
          # 镜像 entrypoint 就是 /k6，这里只需传子命令 run；
          # 显式带 --profile perf 确保能定位到 profile 化的 k6 服务
          docker compose $COMPOSE_ARGS --profile perf run --rm k6 \
            run /scripts/load-test.js --vus 50 --duration 30s

      - name: 有 k6 用例但 CI 覆盖文件未提供 k6 服务（诚实失败）
        if: steps.perf.outputs.has-k6 == 'true' && steps.perf.outputs.has-k6-service != 'true'
        run: |
          echo "::error::tests/performance/ 存在 k6 脚本，但 deploy/docker-compose.ci.yml 未定义 k6 服务，性能门禁无法真实执行。请按 ticket-system 已验证模式补齐覆盖文件。"
          exit 1

      - name: 销毁环境
        if: always() && steps.perf.outputs.has-k6 == 'true'
        run: docker compose $COMPOSE_ARGS --profile perf down -v --remove-orphans

  # ---------- 门禁7：部署到 staging（隔离环境）----------
  deploy-staging:
    name: 部署 staging（隔离环境）
    runs-on: ubuntu-latest
    needs: [detect-stack, integration-e2e, security-scan, performance-test]
    environment: staging              # GitHub Environment，可加人工审批
    steps:
      - uses: actions/checkout@v4

      - name: 检测 gates 服务（决定 health 门禁执行方式）
        id: services
        run: |
          if docker compose $COMPOSE_ARGS --profile gates config --services | grep -qx 'gates'; then
            echo "has-gates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-gates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并部署 staging（含 gates 执行器）
        if: steps.services.outputs.has-gates == 'true'
        run: docker compose $COMPOSE_ARGS --profile gates up -d --build --wait

      - name: 构建并部署 staging（主 compose 原样）
        if: steps.services.outputs.has-gates != 'true'
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait

      # health 门禁两条分支都是真实探测，理由与 integration-e2e 相同：
      # 有 gates 服务 → 容器内打点服务名；无 gates → 宿主机打点已发布的
      # 127.0.0.1:18080（主 compose 的既定端口发布语义）。
      - name: 门禁 health（gates 容器内，探 backend 服务名）
        if: steps.services.outputs.has-gates == 'true'
        run: docker compose $COMPOSE_ARGS exec -T gates bash -lc \
          'HEALTH_HOST=backend PORT=8000 bash scripts/health.sh'

      - name: 门禁 health（宿主机，探 compose 已发布的 127.0.0.1:18080）
        if: steps.services.outputs.has-gates != 'true'
        run: PORT=18080 bash scripts/health.sh

      - name: 销毁隔离环境（用完即弃）
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans

      - name: 归档 runbook
        uses: actions/upload-artifact@v4
        with:
          name: runbook
          path: docs/runbook.md
          if-no-files-found: warn      # 首次运行可能尚未产出，不应因此中断

  # ---------- 生产发布：仅手动触发 + 人工审批（不自动上线）----------
  deploy-prod:
    name: 部署生产（需人工审批）
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production           # 配置 Required reviewers 实现人工审批
    steps:
      - run: echo "生产发布需在 GitHub Environment 配置 Required reviewers，人工审批后才会执行"
      # 生产部署命令（灰度 + 回滚策略）在此处，绝不自动执行
