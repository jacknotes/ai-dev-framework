openapi: 3.0.3
info:
  title: Vue + Go 示例 API
  version: 0.1.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/greeting:
    get:
      summary: 返回问候语
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [message, time]
                properties:
                  message:
                    type: string
                    example: Hello from Go backend
                  time:
                    type: string
                    format: date-time
                    example: 2026-11-20T08:00:00Z
        '405':
          description: 方法不允许
