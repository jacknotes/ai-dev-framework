openapi: 3.0.3
info:
  title: JSP + Servlet 示例 API
  version: 0.1.0
  description: |
    JSP + Servlet 模板的 Ajax 接口契约（框架规范：契约先行，机器可校验）。

    本契约**只覆盖 Ajax 接口**，不覆盖 JSP 页面本身。页面由 `docs/pages.md`
    页面清单管理——JSP 项目需要两份契约，缺一不可。

    实现约定：
    - 命名空间为 Jakarta EE（jakarta.servlet.*），运行于 Tomcat 10.1。
    - 响应统一 UTF-8：Content-Type 为 application/json;charset=UTF-8。
    - 时间字段为 ISO-8601 带时区偏移的字符串，不做时区换算。
servers:
  - url: http://localhost:8080
    description: 本地 / 隔离环境（ROOT 上下文）
tags:
  - name: infra
    description: 基础设施端点，不带版本前缀
  - name: greeting
    description: 业务接口
paths:
  /health:
    get:
      tags: [infra]
      summary: 健康检查
      description: |
        存活探针。返回体必须严格为 {"status":"ok"}，字段名与取值不可变化，
        供 Docker HEALTHCHECK 与 scripts/health.sh 解析。
      operationId: getHealth
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
  /api/v1/greeting:
    get:
      tags: [greeting]
      summary: 返回问候语
      description: |
        返回问候语正文与服务器当前时间。字段名 message、time 由契约固定，
        视图模块不得依赖契约之外的字段。
      operationId: getGreeting
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [message, time]
                additionalProperties: false
                properties:
                  message:
                    type: string
                    description: 问候语正文
                    example: Hello from JSP backend
                  time:
                    type: string
                    format: date-time
                    description: 服务器当前时间，ISO-8601 带时区偏移
                    example: '2026-11-25T20:21:41+08:00'
              examples:
                default:
                  summary: 典型响应
                  value:
                    message: Hello from JSP backend
                    time: '2026-11-25T20:21:41+08:00'
        '405':
          description: 方法不允许（例如对该端点使用 POST）
