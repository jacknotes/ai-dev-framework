openapi: 3.0.3
info:
  title: .NET + Vue 示例 API
  version: 0.1.0
  description: |
    AI 多智能体协同开发框架的 .NET 模板接口契约。
    本文件是前后端唯一事实源：代码与契约不一致时，以本文件为准。
servers:
  - url: http://localhost:8000
    description: 本地开发直连后端
  - url: http://localhost
    description: 隔离环境经 Nginx 反向代理
paths:
  /health:
    get:
      summary: 健康检查
      description: 供容器 HEALTHCHECK 与门禁脚本 scripts/health.sh 使用。
      operationId: getHealth
      tags: [系统]
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/greeting:
    get:
      summary: 返回问候语
      description: 前端首页唯一数据来源；message 为固定文案，time 为服务端 UTC 时间。
      operationId: getGreeting
      tags: [示例业务]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [message, time]
                properties:
                  message:
                    type: string
                    example: Hello from .NET backend
                  time:
                    type: string
                    format: date-time
                    description: 服务端 UTC 时间，ISO-8601 往返格式（DateTime.UtcNow.ToString("O")）。
                    example: "2026-11-25T12:00:00.0000000Z"
        '405':
          description: 方法不允许
