# Nginx 站点配置（放在 /etc/nginx/conf.d/default.conf，实际处于 http 上下文）
# 说明：容器以 read_only 根文件系统运行时，只有 compose 挂载为 tmpfs 的
#       /tmp 与 /var/cache/nginx 可写；本文件不重复声明 temp 路径，
#       避免与镜像自带 nginx.conf 的默认值冲突（重复指令会启动失败）。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API 到隔离网络内的 backend 容器（同源访问，规避浏览器跨域）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 容器健康检查用轻量端点（不依赖前端产物是否完整，也不打后端）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
